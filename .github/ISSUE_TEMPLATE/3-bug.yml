name: Bug
description: Behaviour that contradicts the spec, the docs or the tests.
title: ""
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Security problems:** don't file them here. Use the private vulnerability report linked on the previous screen.
        Never paste document contents, tokens or share links.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what should have happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a project in two windows
        2. ...
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - "SEV1: data loss, or nobody can edit"
        - "SEV2: major feature broken"
        - "SEV3: minor degradation"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Sync devtools state, close codes, Sentry link, log lines with connection IDs.
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "production / staging / local · browser and OS · commit or release"
  - type: textarea
    id: regression
    attributes:
      label: Regression test
      description: The test that would have caught this. Required in the fix PR.
