name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a project in two windows
        2. ...
    validations:
      required: true
  - type: textarea
    id: devtools
    attributes:
      label: Sync devtools panel
      description: Connection state, pending updates and recent message types, if relevant. Never paste document contents or tokens.
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Firefox 150 on macOS
