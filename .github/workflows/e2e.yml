name: E2E

# Playwright suite on Chromium, Firefox and WebKit against the production
# build and the docker compose stack. Today: the shell, the editor, local
# persistence, cross-tab sync, route budgets and the M2 exit test. Later:
# 2-3 concurrent editors through the server, offline merge, viewer read-only.
# Local: pnpm infra:up && pnpm test:e2e

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Start the stack (docker compose)
        run: pnpm infra:up

      - name: Install ${{ matrix.browser }}
        run: pnpm --filter @lockstep/e2e exec playwright install --with-deps ${{ matrix.browser }}

      - name: Run the suite on ${{ matrix.browser }}
        run: pnpm --filter @lockstep/e2e test:e2e --project=${{ matrix.browser }}

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.browser }}
          path: e2e/playwright-report
          retention-days: 7
